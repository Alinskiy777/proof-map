<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Карта доказательств</title>
<style>
  :root{--bg:#0b1020;--fg:#e8eaf2;--dim:#8b93ab;--card:#141b31;--line:#26304d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:16px 20px 8px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.2px}
  .sub{color:var(--dim);font-size:13px;margin-top:4px}
  .bar{display:flex;gap:10px;padding:12px 20px;flex-wrap:wrap;align-items:center}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:8px 12px;font-size:12.5px}
  .stat b{font-size:17px;display:block}
  .legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 20px 12px;font-size:12px;color:var(--dim)}
  .lg{display:flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%}
  #map{width:100%;height:auto;display:block;padding:0 10px 20px}
  .node{cursor:pointer}
  .node:hover circle{stroke:#fff;stroke-width:2}
  #panel{position:fixed;inset:auto 0 0 0;background:var(--card);
         border-top:1px solid var(--line);padding:16px 20px;display:none;
         max-height:52vh;overflow:auto}
  #panel.on{display:block}
  #panel h3{margin:0 0 6px;font-size:16px}
  #panel .meta{color:var(--dim);font-size:12.5px;margin-bottom:10px}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;margin:2px 4px 2px 0}
  .verdict{padding:9px 12px;border-radius:8px;font-size:13.5px;margin:10px 0}
  .v-bad{background:#3b1520;border:1px solid #7f1d3a;color:#ffc9d6}
  .v-warn{background:#33280f;border:1px solid #78551a;color:#ffe0a3}
  .v-ok{background:#0f2c1c;border:1px solid #1d5c39;color:#b6f0cf}
  .obj{color:var(--dim);font-size:13px;margin-top:8px;font-style:italic}
  .close{position:absolute;top:12px;right:20px;cursor:pointer;color:var(--dim);font-size:22px}

  /* ── экран «Пробелы» ── */
  #gaps{display:none;padding:0 20px 30px}
  #gaps.on{display:block}
  .gap{border:1px solid var(--line);border-radius:12px;background:var(--card);
       padding:13px 15px;margin-bottom:10px;position:relative;overflow:hidden}
  .gap::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--risk)}
  .gap h4{margin:0 0 5px;font-size:14.5px;font-weight:600;padding-right:120px}
  .gap .why{color:#ffb4c6;font-size:12.5px;margin-bottom:8px}
  .gap .meta{color:var(--dim);font-size:12px;margin-bottom:9px}
  .risk-badge{position:absolute;top:13px;right:15px;background:#3b1520;color:#ffc9d6;
              border:1px solid #7f1d3a;border-radius:20px;padding:2px 9px;font-size:11.5px}
  .src-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .src-row input{flex:1;min-width:190px;background:#0d1426;border:1px solid var(--line);
                 color:var(--fg);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit}
  .src-row input:focus{outline:none;border-color:#3b82f6}
  .btn{background:#1e3a8a;color:#dbeafe;border:1px solid #2b4a9e;border-radius:8px;
       padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .btn:hover{background:#2547a8}
  .chip{font-size:11.5px;background:#16233d;border:1px solid var(--line);
        border-radius:6px;padding:3px 8px;color:#a9c7ff}
  .done-note{color:#8ee0b0;font-size:12px;margin-top:6px}
  .tabs{display:flex;gap:8px;padding:0 20px 12px}
  /* ── ползунок силы утверждения ── */
  .slider-row{display:flex;align-items:center;gap:10px;margin-top:10px;
              padding-top:9px;border-top:1px dashed var(--line);flex-wrap:wrap}
  .slider-row label{color:var(--dim);font-size:12.5px;white-space:nowrap}
  .slider-row input[type=range]{flex:1;min-width:130px;accent-color:#3b82f6;cursor:pointer}
  .claim-val{font-weight:700;font-size:13px;min-width:22px;text-align:center;
             color:#9ec5ff;font-variant-numeric:tabular-nums}
  .sr-btn{background:#3b1520;color:#ffc9d6;border:1px solid #7f1d3a;border-radius:8px;
          padding:6px 11px;font-size:12px;cursor:pointer;font-family:inherit}
  .sr-btn:hover{background:#4d1a29}
  .sr-note{color:var(--dim);font-size:11.5px;flex-basis:100%;margin-top:2px}
  .sr-good{color:#8ee0b0}
  .tab{background:var(--card);border:1px solid var(--line);border-radius:9px;
       padding:7px 15px;font-size:13px;cursor:pointer;color:var(--dim)}
  .tab.on{color:var(--fg);border-color:#3b82f6;background:#14213f}
  /* ── блок «живые люди» ── */
  .push{margin-top:10px;border:1px solid #3d1f2e;background:#150d16;border-radius:10px;overflow:hidden}
  .push-h{display:flex;justify-content:space-between;align-items:center;cursor:pointer;
          padding:9px 12px;font-size:12.5px;color:#ffb4c6;user-select:none}
  .push-h:hover{background:#1e1019}
  .push-n{background:#7f1d3a;color:#ffd9e2;border-radius:14px;padding:1px 9px;font-size:11.5px}
  .push-body{padding:0 12px 11px;display:none}
  .push.open .push-body{display:block}
  .k-cluster{margin-bottom:9px}
  .k-name{color:#ffc9d6;font-size:12.5px;font-weight:600;margin-bottom:2px}
  .k-meta{color:var(--dim);font-size:11px;margin-bottom:5px}
  .q{border-left:2px solid #7f1d3a;padding:2px 0 2px 9px;margin-bottom:6px;
     font-size:12.5px;color:#d9c9cf;font-style:italic}
  .q .ref{color:#8a7a80;font-style:normal;font-size:11px}
</style>
</head>
<body>
<header>
  <h1>Карта доказательств</h1>
  <div class="sub" id="subtitle">загрузка…</div>
</header>
<div class="bar" id="stats"></div>
<div class="legend">
  <div class="lg"><span class="dot" style="background:#22c55e"></span>доказано</div>
  <div class="lg"><span class="dot" style="background:#eab308"></span>частично / без n</div>
  <div class="lg"><span class="dot" style="background:#ef4444"></span>дыра</div>
  <div class="lg">размер = сила доказательства · нажми на вершину</div>
</div>
<div class="tabs">
  <div class="tab on" id="tabMap" onclick="go('map')">Карта</div>
  <div class="tab" id="tabGaps" onclick="go('gaps')">Пробелы <b id="gapCount"></b></div>
  <div class="tab" id="tabReal" onclick="go('real')">Живые люди <b id="objCount"></b></div>
</div>
<svg id="map" viewBox="0 0 1000 720"></svg>
<div id="gaps"></div>
<div id="real"></div>
<div id="panel"><span class="close" onclick="hide()">×</span><div id="pbody"></div></div>

<script src="data/engine.js"></script>
<script src="data/niche-faceless.js"></script>
<script src="data/objections-faceless.js"></script>
<script src="data/competitor-proof.js"></script>
<script>
const {TAXONOMY, STRENGTH, auditClaim} = ProofMap;
const N = NICHES.faceless_youtube.claims;

// ── раскладка: 8 ветвей по кольцу, вершины дугой вокруг центра ──
const CX=500, CY=350, R=250;
const branches = Object.keys(TAXONOMY);

function statusOf(c){
  const a = auditClaim(c);
  if (!a.ok) return {s:'bad', a};
  if (a.warn) return {s:'warn', a};
  return {s:'ok', a};
}

const esc = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const esc2 = s => String(s).replace(/[&<>"]/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function drawMap(claims){
const byB2 = {}; branches.forEach(b => byB2[b]=[]);
claims.forEach(c => (byB2[c.branch]||byB2.market).push(c));
const pos = {};   // id -> {x,y}
branches.forEach((b,bi)=>{
  const a = -Math.PI/2 + bi*(2*Math.PI/branches.length);
  const bx = CX + Math.cos(a)*R*0.62, by = CY + Math.sin(a)*R*0.62;
  const list = byB2[b];
  const spread = Math.min(1.15, list.length*0.16);
  list.forEach((c,ci)=>{
    const aa = a - spread/2 + (list.length>1 ? spread*ci/(list.length-1) : spread/2);
    pos[c.id] = { x: CX + Math.cos(aa)*R, y: CY + Math.sin(aa)*R, bx, by, b };
  });
});



// ── рисуем ──
let svg = '';
branches.forEach(b=>{
  const list = byB2[b]; if(!list.length) return;
  const p = pos[list[0].id];
  svg += `<line x1="${CX}" y1="${CY}" x2="${p.bx.toFixed(1)}" y2="${p.by.toFixed(1)}"
            stroke="${TAXONOMY[b].color}" stroke-width="2" opacity=".38"/>`;
  svg += `<circle cx="${p.bx.toFixed(1)}" cy="${p.by.toFixed(1)}" r="7" fill="${TAXONOMY[b].color}"/>`;
  svg += `<text x="${p.bx.toFixed(1)}" y="${(p.by-13).toFixed(1)}" text-anchor="middle"
            fill="${TAXONOMY[b].color}" font-size="12.5" font-weight="600">${esc(TAXONOMY[b].name)}</text>`;
  svg += `<text x="${p.bx.toFixed(1)}" y="${(p.by+20).toFixed(1)}" text-anchor="middle"
            fill="#8b93ab" font-size="10">${list.length}</text>`;
});
branches.forEach(b=>{
  byB2[b].forEach(c=>{
    const p = pos[c.id], st = statusOf(c);
    const w = STRENGTH[c.type] ? STRENGTH[c.type].w : 3;
    const r = 7 + w*1.5;
    const col = st.s==='ok' ? '#22c55e' : st.s==='warn' ? '#eab308' : '#ef4444';
    svg += `<line x1="${p.bx.toFixed(1)}" y1="${p.by.toFixed(1)}" x2="${p.x.toFixed(1)}"
             y2="${p.y.toFixed(1)}" stroke="#26304d" stroke-width="1"/>`;
    svg += `<g class="node" onclick="show('${c.id}')">
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}"
              fill="${col}" opacity="${(0.18+w*0.06).toFixed(2)}" stroke="${col}" stroke-width="1.5"/>
    </g>`;
  });
});
document.getElementById('map').innerHTML = svg;
}   // end drawMap
drawMap(N);

// ── статистика ──
const st = N.map(statusOf);
const cnt = k => st.filter(x=>x.s===k).length;
document.getElementById('subtitle').textContent =
  NICHES.faceless_youtube.name + ' · ' + N.length + ' утверждений';
document.getElementById('stats').innerHTML = `
  <div class="stat"><b style="color:#22c55e">${cnt('ok')}</b>доказано</div>
  <div class="stat"><b style="color:#eab308">${cnt('warn')}</b>частично</div>
  <div class="stat"><b style="color:#ef4444">${cnt('bad')}</b>дыр</div>
  <div class="stat"><b>${Math.round(cnt('ok')/N.length*100)}%</b>покрыто доказательствами</div>`;

// ── панель вершины ──
function show(id){
  const c = N.find(x=>x.id===id); if(!c) return;
  const stt = statusOf(c), w = STRENGTH[c.type]||{w:3,name:c.type};
  const a = stt.a;
  const verdict = !a.ok ? `<div class="verdict v-bad">❌ ${esc(a.msg)}</div>`
    : a.warn ? `<div class="verdict v-warn">⚠ ${esc(a.warn)}</div>`
    : `<div class="verdict v-ok">✅ Доказательство держит утверждение</div>`;
  const srcs = (c.sources&&c.sources.length)
    ? c.sources.map(s=>`<span class="tag" style="background:#1b2c47;color:#a9c7ff">${esc(s.name)}${s.n?` · n=${s.n}`:' · n не указан'}</span>`).join('')
    : `<span class="tag" style="background:#3b1520;color:#ffc9d6">источников нет</span>`;
  document.getElementById('pbody').innerHTML = `
    <h3>${esc(c.text)}</h3>
    <div class="meta">Ветвь: ${esc(TAXONOMY[c.branch].name)} · тип: ${esc(w.name)} ·
         сила доказательства ${w.w}/10 · сила утверждения ${c.claimPower}/10</div>
    ${verdict}
    <div>${srcs}</div>
    ${c.objection?`<div class="obj">Возражение: ${esc(c.objection)}</div>`:''}`;
  document.getElementById('panel').classList.add('on');
}
function hide(){ document.getElementById('panel').classList.remove('on'); }

// ═══ ЭКРАН «ПРОБЕЛЫ» ═══
// Главный экран приложения: что НЕ доказано, отсортировано по риску.
// Добавленные источники живут в localStorage — дыра закрывается руками.
const LS = 'proofmap.sources.v1';
function loadAdded(){
  try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch(e){ return {}; }
}
function saveAdded(m){ try { localStorage.setItem(LS, JSON.stringify(m)); } catch(e){} }

function merged(){
  // Учитываем оба честных пути: добавленные источники И изменённый голос.
  // Всё, что не трогали, остаётся как в источнике — никаких выдумок.
  const added = loadAdded();
  const cl = loadClaims();
  return N.map(c => {
    let out = c;
    if (cl[c.id] !== undefined) out = Object.assign({}, out, {claimPower: cl[c.id]});
    const a = added[c.id];
    if (a && a.length) out = Object.assign({}, out, {sources: (c.sources||[]).concat(a)});
    return out;
  });
}

// ── БЛОК «ЧТО ГОВОРЯТ ЖИВЫЕ ЛЮДИ» ──
// Связка Reddit ↔ карта: кластеры возражений, бьющие в это утверждение.
// Цитаты дословные, из r/NewTubers, каждая проверена по исходнику.
function pushBlock(id){
  const ks = objectionsFor(id);
  if (!ks || !ks.length) return '';
  const total = ks.reduce((s,k)=>s+k.count, 0);
  const body = ks.map(k => `<div class="k-cluster">
      <div class="k-name">${esc2(k.name)}</div>
      <div class="k-meta">${k.count} из ${k.sample} комментариев · сила удара ${k.power}/10 · как закрыть: ${esc2(k.fix)}</div>
      ${k.quotes.map(q => `<div class="q">«${esc2(q.t)}» <span class="ref">[${q.n}]</span></div>`).join('')}
    </div>`).join('');
  return `<div class="push" id="push_${id}">
      <div class="push-h" onclick="this.parentNode.classList.toggle('open')">
        <span>⚡ что говорят живые люди <i>(${ks.length} ${ks.length===1?'кластер':'кластеров'}, ${total} упоминаний)</i></span>
        <span class="push-n">${ks.length}</span>
      </div>
      <div class="push-body">${body}</div>
    </div>`;
}

function go(screen){
  document.getElementById('tabMap').classList.toggle('on', screen==='map');
  document.getElementById('tabGaps').classList.toggle('on', screen==='gaps');
  document.getElementById('tabReal').classList.toggle('on', screen==='real');
  document.getElementById('map').style.display  = screen==='map' ? 'block' : 'none';
  document.getElementById('gaps').classList.toggle('on', screen==='gaps');
  document.getElementById('real').classList.toggle('on', screen==='real');
  if (screen==='gaps') renderGaps();
  if (screen==='real') renderReal();
}

// ── ВКЛАДКА «ЖИВЫЕ ЛЮДИ» ──
// Обзор: 10 кластеров возражений, кто в какие утверждения бьёт.
// Это противоположность нашей карте: там мы заявляем, здесь живые люди спорят.
function renderReal(){
  if (!window.OBJECTIONS){ return; }
  const M = OBJECTIONS.meta;
  const box = document.getElementById('real');
  document.getElementById('objCount').textContent = OBJECTIONS.clusters.length;
  const head = `<div class="obj" style="margin-bottom:14px">
      Источник: ${esc2(M.source)} · собрано ${M.collected}<br>
      ${esc2(M.verified)}<br>
      ⚠️ ${esc2(M.caveat)}</div>`;
  const rows = OBJECTIONS.clusters
    .map(k => `<div class="gap" style="--risk:${k.power>=9?'#ef4444':k.power>=7?'#f97316':'#eab308'}">
        <div class="risk-badge">сила ${k.power}/10</div>
        <h4>${esc2(k.name)}</h4>
        <div class="why">${esc2(k.gist)}</div>
        <div class="meta">${k.count} из ${k.sample} комментариев · ломает: ${k.hits.map(h=>{
            const c = N.find(x=>x.id===h); return c ? esc2(c.text.slice(0,40)) : h; }).join(' · ')}</div>
        ${k.quotes.map(q=>`<div class="q">«${esc2(q.t)}» <span class="ref">[${q.n}]</span></div>`).join('')}
        <div class="obj">Как закрыть: ${esc2(k.fix)}</div>
      </div>`).join('');
  box.innerHTML = head + rows;
}

function renderGaps(){
  const list = merged().map(c => ({c, r: riskOf(c), a: auditClaim(c)}))
                        .filter(x => !(x.a.ok && !x.a.warn))
                        .sort((x, y) => y.r - x.r);
  document.getElementById('gapCount').textContent = list.length;
  document.getElementById('gaps').innerHTML =
    list.length === 0
      ? '<div class="stat" style="display:inline-block">✅ Дыр нет. Все утверждения держатся доказательствами.</div>'
      : list.map(x => {
        const c = x.c, w = STRENGTH[c.type] || {w:3, name:c.type};
        const col = x.r >= 9 ? '#ef4444' : x.r >= 6 ? '#f97316' : '#eab308';
        const srcs = (c.sources||[]).map(s =>
          `<span class="chip">${esc2(s.name)}${s.n?' · n='+s.n:' · n не указан'}</span>`).join(' ');
        return `<div class="gap" style="--risk:${col}">
          <div class="risk-badge">риск ${x.r}</div>
          <h4>${esc2(c.text)}</h4>
          <div class="why">${x.a.ok ? '⚠ '+esc2(x.a.warn) : '❌ '+esc2(x.a.msg)}</div>
          <div class="meta">${esc2(TAXONOMY[c.branch].name)} · ${esc2(w.name)}
            · сила доказательства ${w.w}/10 · сила утверждения ${claimOf(c)}/10</div>
          <div>${srcs || '<span class="chip" style="color:#ffb4c6;border-color:#7f1d3a">источников нет</span>'}</div>
          <div class="src-row" style="margin-top:9px">
            <input id="in_${c.id}" placeholder="добавить источник: что именно доказывает">
            <div class="btn" onclick="addSrc('${c.id}')">закрыть дыру</div>
          </div>
          ${pushBlock(c.id)}
          <div class="slider-row">
            <label>сила утверждения</label>
            <input type="range" min="1" max="10" value="${claimOf(c)}" id="sl_${c.id}"
                   oninput="setClaim('${c.id}', this.value)">
            <div class="claim-val" id="cv_${c.id}">${claimOf(c)}</div>
            <div class="sr-btn" onclick="lowerClaim('${c.id}')">приравнять к доказательству</div>
            <div class="sr-note" id="sn_${c.id}"></div>
          </div>
          ${c.objection ? `<div class="obj">Возражение: ${esc2(c.objection)}</div>` : ''}
          <div id="ok_${c.id}"></div>
        </div>`;
      }).join('');
  list.forEach(x => verdictNote(x.c.id));   // подписи под ползунками — сразу
}

function addSrc(id){
  const el = document.getElementById('in_' + id);
  const v = (el.value || '').trim();
  if (!v) return;
  const m = loadAdded(); (m[id] = m[id] || []).push({name: v, n: null});
  saveAdded(m);
  el.value = '';
  renderGaps();
  repaint();
  // 🔴 Честно: источник не равен закрытой дыре. Если утверждение всё ещё
  // громче доказательства — дыра останется, и сказать «✓» было бы враньём.
  verdictNote(id);
  // Явный вердикт по самому действию «добавил источник» — три честных состояния.
  const vc = merged().find(x => x.id === id);
  const va = vc ? auditClaim(vc) : null;
  const vbox = document.getElementById('ok_' + id);
  if (va && vbox){
    vbox.innerHTML = (!va.ok)
      ? '<div class="done-note" style="color:#ffb4c6">✗ Источник добавлен, но дыра НЕ закрыта: ' + esc2(va.msg || 'голос выше доказательства') + '</div>'
      : va.warn
        ? '<div class="done-note" style="color:#ffe0a3">△ Источник добавлен, но осталось: ' + esc2(va.warn) + '</div>'
        : '<div class="done-note">✓ Источник добавлен — дыра закрыта</div>';
  }
}

// ── ПОЛЗУНОК СИЛЫ УТВЕРЖДЕНИЯ ──
// Бенчивенга: «never make your claim bigger than your proof».
// Два честных пути закрыть дыру: поднять доказательство (источник) или
// опустить голос (этот ползунок). Третьего нет — и приложение это показывает.
const LC = 'proofmap.claims.v1';
function loadClaims(){ try { return JSON.parse(localStorage.getItem(LC)) || {}; } catch(e){ return {}; } }
function saveClaims(m){ try { localStorage.setItem(LC, JSON.stringify(m)); } catch(e){} }

function claimOf(c){
  const m = loadClaims();
  return (m[c.id] !== undefined) ? m[c.id] : c.claimPower;
}

function setClaim(id, v){
  const m = loadClaims(); m[id] = +v; saveClaims(m);
  document.getElementById('cv_' + id).textContent = v;
  // карта и статистика — по новому голосу
  repaint();
  verdictNote(id);
}

function lowerClaim(id){
  const c = merged().find(x => x.id === id);
  if (!c) return;
  const w = STRENGTH[c.type] ? STRENGTH[c.type].w : 3;
  setClaim(id, w);                 // ровно по доказательству — не ниже
}

function verdictNote(id){
  const c = merged().find(x => x.id === id);
  if (!c) return;
  const a = auditClaim(c);
  const note = document.getElementById('sn_' + id);
  if (!note) return;
  const w = STRENGTH[c.type] ? STRENGTH[c.type].w : 3;
  const cp = claimOf(c);
  let html;
  if (!a.ok){
    const d = cp - w;
    html = '<span style="color:#ffb4c6">голос на ' + d + ' выше доказательства — '
         + '«Yeah, sure». Опустить до ' + w + ' или собрать доказательства силы ' + cp + '.</span>';
  } else if (a.warn){
    html = '<span style="color:#ffe0a3">' + esc2(a.warn) + '</span>';
  } else {
    html = '<span class="sr-good">✓ дыры нет: голос ' + cp + ' ≤ доказательства ' + w + '</span>';
  }
  note.innerHTML = html;
}

function refreshStats(){
  const list = merged();
  const s2 = list.map(c => { const a = auditClaim(c);
    return !a.ok ? 'bad' : a.warn ? 'warn' : 'ok'; });
  const cnt = k => s2.filter(x => x === k).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b style="color:#22c55e">${cnt('ok')}</b>доказано</div>
    <div class="stat"><b style="color:#eab308">${cnt('warn')}</b>частично</div>
    <div class="stat"><b style="color:#ef4444">${cnt('bad')}</b>дыр</div>
    <div class="stat"><b>${Math.round(cnt('ok')/list.length*100)}%</b>покрыто доказательствами</div>`;
}

// пересчёт после добавления источника: карта и статистика должны честно меняться
function repaint(){
  drawMap(merged());
  refreshStats();
}

renderGaps();
</script>
</body>
</html>
