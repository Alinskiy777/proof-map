<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Карта доказательств — faceless YouTube</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#0b0f14; --panel:#161b22; --panel2:#1c2129; --line:#30363d;
    --txt:#e6edf3; --dim:#8b949e; --dim2:#6e7681;
    --red:#f85149; --amber:#d29922; --green:#3fb950; --blue:#58a6ff; --violet:#a371f7;
    --board:#0f141c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}

  header{position:fixed;inset:0 0 auto 0;z-index:40;background:rgba(13,17,23,.92);
         backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
         padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  h1{font-size:18px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
  h1 .accent{color:var(--blue)}
  .sub{color:var(--dim);font-size:12.5px;white-space:nowrap}
  .spacer{flex:1}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
       padding:7px 13px;border-radius:9px;font-size:13px;cursor:pointer;font-weight:600}
  .btn:hover{border-color:var(--blue);color:#fff}
  .btn.pri{background:#1f6feb;border-color:#1f6feb;color:#fff;text-decoration:none}
  .btn.pri:hover{background:#2f7df0}

  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12px}
  .stat b{font-size:17px;display:block;line-height:1.1}

  #stage{position:fixed;inset:0;overflow:hidden;cursor:grab}
  #stage.drag{cursor:grabbing}
  #canvas{position:absolute;top:0;left:0;transform-origin:0 0;
          background:radial-gradient(circle,#2a3340 1px,transparent 1px) 0 0/26px 26px,var(--board)}
  #canvas svg{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}

  .node{position:absolute;transform:translate(-50%,-50%);cursor:pointer;user-select:none;
        background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:11px 14px 11px 16px;min-width:196px;max-width:262px;
        box-shadow:0 6px 22px rgba(0,0,0,.45);transition:transform .12s,border-color .12s}
  .node::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
                border-radius:12px 0 0 12px;background:var(--nc,#58a6ff)}
  .node:hover{transform:translate(-50%,-50%) scale(1.045);border-color:var(--nc,#58a6ff);z-index:5}
  .node.sel{border-color:var(--nc,#58a6ff);box-shadow:0 0 0 2px var(--nc,#58a6ff),0 8px 26px rgba(0,0,0,.6)}
  .node .num{font-size:10px;color:var(--dim2);font-weight:700;letter-spacing:.6px}
  .node .nm{font-size:14px;font-weight:700;margin:2px 0 1px;line-height:1.25}
  .node .en{font-size:10.5px;color:var(--dim);font-style:italic}
  .node .cnt{position:absolute;top:9px;right:10px;font-size:11px;font-weight:700;
             background:var(--nc,#58a6ff);color:#08111f;border-radius:20px;padding:1px 7px}
  .node .src{font-size:9.5px;color:var(--dim2);margin-top:5px;border-top:1px solid var(--line);padding-top:4px}

  .root{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;
        width:230px;padding:20px 18px;border-radius:20px;
        background:linear-gradient(150deg,#1f6feb,#a371f7);
        box-shadow:0 12px 44px rgba(31,111,235,.42)}
  .root .t{font-size:19px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
  .root .d{font-size:11.5px;opacity:.85;margin-top:7px}

  #panel{position:fixed;inset:auto 0 0 0;z-index:50;background:var(--panel);
         border-top:1px solid var(--line);padding:18px 22px 26px;display:none;
         max-height:60vh;overflow:auto;box-shadow:0 -18px 50px rgba(0,0,0,.6)}
  #panel.on{display:block}
  #panel .head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  #panel h2{font-size:19px;font-weight:750;letter-spacing:-.3px}
  #panel .meta{color:var(--dim);font-size:12.5px;margin-top:3px}
  #panel .close{margin-left:auto;background:none;border:1px solid var(--line);color:var(--dim);
                width:32px;height:32px;border-radius:9px;font-size:18px;cursor:pointer}
  #panel .close:hover{color:#fff;border-color:var(--red)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);
        background:var(--panel2);color:var(--dim)}
  .chip b{color:var(--txt)}

  .proof{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;
         background:var(--panel2);border-left:3px solid var(--pc,#58a6ff)}
  .proof .q{font-size:14px}
  .proof .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:11.5px;color:var(--dim)}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.4px}
  .t-src{background:#1f2937;color:#8b949e}
  .t-str{background:#12361f;color:#56d364}
  .t-n{background:#33280f;color:#e3b341}
  .t-url{background:#0b2440;color:#79c0ff;max-width:100%;word-break:break-all;text-decoration:none}
  .t-url:hover{text-decoration:underline}
  .proof .note{font-size:12px;color:var(--dim);margin-top:7px;font-style:italic}

  .empty{padding:26px;text-align:center;color:var(--dim);font-size:14px}
  .empty b{color:var(--amber)}

  #legend{position:fixed;left:20px;bottom:16px;z-index:30;display:flex;gap:14px;flex-wrap:wrap;
          font-size:11.5px;color:var(--dim);background:rgba(13,17,23,.85);
          border:1px solid var(--line);border-radius:10px;padding:8px 12px;backdrop-filter:blur(8px)}
  .lg{display:flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%}
  #hint{position:fixed;right:20px;bottom:16px;z-index:30;font-size:11px;color:var(--dim2);
        background:rgba(13,17,23,.85);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  @media(max-width:720px){ .stats{display:none} h1{font-size:15px} #hint{display:none} }
</style>
</head>
<body>

<header>
  <h1>Карта <span class="accent">доказательств</span></h1>
  <div class="sub">faceless YouTube · ниша монетизации</div>
  <div class="spacer"></div>
  <div class="stats" id="stats"></div>
  <button class="btn" onclick="resetView()">Сброс вида</button>
  <a class="btn pri" href="dash.html">Дашборды →</a>
</header>

<div id="stage">
  <div id="canvas">
    <svg id="links"></svg>
    <div class="root" id="rootNode">
      <div class="t">КАРТА<br>ДОКАЗАТЕЛЬСТВ</div>
      <div class="d" id="rootSub">загрузка…</div>
    </div>
  </div>
</div>

<div id="panel">
  <div class="head">
    <div>
      <h2 id="pTitle"></h2>
      <div class="meta" id="pMeta"></div>
    </div>
    <button class="close" onclick="closePanel()">×</button>
  </div>
  <div class="chips" id="pChips"></div>
  <div id="pList"></div>
</div>

<div id="legend"></div>
<div id="hint">колесо — масштаб · drag — сдвинуть · клик по узлу — доказательства</div>

<script src="data/types.js"></script>
<script src="data/proofs.js"></script>
<script src="data/platform-proofs.js"></script>
<script src="data/engine.js"></script>
</body>
</html>
